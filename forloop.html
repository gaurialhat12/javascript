<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for loop </title>
</head>
<body>
    <h1> for loop javascript</h1>
    <p id="demo"></p>
</body>
<script>
let text = "";

for (let i = 0; i < 6; i++) {
  text += "The number is " + i + "<br>";
}

document.getElementById("demo").innerHTML = text;
</script>

</html>
